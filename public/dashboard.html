<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskHub — Dashboard</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body data-page="dashboard">

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">DeskHub</span>
      <nav class="topbar-nav">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="tickets.html"   class="nav-link">Tickets</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode (Ctrl+D)"></button>
      <span id="topbar-user" class="topbar-user"></span>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <main class="app-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub" id="user-greeting">Welcome back!</p>
      </div>
      <a href="tickets.html" class="btn btn-primary">View All Tickets</a>
    </div>

    <!-- Stat cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon stat-icon-total">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="stat-label">Total Tickets</div>
        <div class="stat-value" id="stat-total"><span class="spinner-sm"></span></div>
      </div>
      <div class="stat-card stat-card-open">
        <div class="stat-icon stat-icon-open">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-label">Open</div>
        <div class="stat-value" id="stat-open"><span class="spinner-sm"></span></div>
      </div>
      <div class="stat-card stat-card-inprogress">
        <div class="stat-icon stat-icon-inprogress">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </div>
        <div class="stat-label">In Progress</div>
        <div class="stat-value" id="stat-inprogress"><span class="spinner-sm"></span></div>
      </div>
      <div class="stat-card stat-card-resolved">
        <div class="stat-icon stat-icon-resolved">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-label">Resolved</div>
        <div class="stat-value" id="stat-resolved"><span class="spinner-sm"></span></div>
      </div>
    </div>

    <!-- Recent tickets -->
    <div class="detail-card" style="margin-top:1.5rem">
      <div class="recent-header">
        <h2 class="detail-section-title">Recent Tickets</h2>
        <a href="tickets.html" class="link-btn">View all →</a>
      </div>

      <div id="recent-loading" class="state-overlay" style="padding:2rem 0">
        <div class="spinner"></div><p>Loading…</p>
      </div>
      <p id="recent-error" class="empty-state-small" style="color:#ef4444;display:none">
        Could not load recent tickets.
      </p>

      <div id="recent-table-wrap" style="display:none">
        <table class="tickets-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-title">Title</th>
              <th class="col-priority">Priority</th>
              <th class="col-status">Status</th>
              <th class="col-date">Created</th>
            </tr>
          </thead>
          <tbody id="recent-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
